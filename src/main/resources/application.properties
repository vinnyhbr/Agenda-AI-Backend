# ===============================
# = APPLICATION CONFIGURATION
# ===============================
spring.application.name=Agenda-AI-Backend
server.port=8080

# ===============================
# = DATABASE CONFIGURATION
# ===============================
# H2 Database (Development)
spring.datasource.url=jdbc:h2:mem:agendaai
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (Development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# PostgreSQL (Production)
# spring.datasource.url=jdbc:postgresql://localhost:5432/agendaai
# spring.datasource.username=postgres
# spring.datasource.password=password
# spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# = OAUTH2 CONFIGURATION
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/calendar
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v2/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=email

# ===============================
# = JWT CONFIGURATION
# ===============================
app.jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatShouldBeLongEnoughAndSecure}
app.jwt.expiration=86400000

# ===============================
# = OPENAI CONFIGURATION
# ===============================
app.openai.api-key=${OPENAI_API_KEY:your-openai-api-key}
app.openai.model=gpt-3.5-turbo

# ===============================
# = APPLICATION CONFIGURATION
# ===============================
app.oauth2.authorized-redirect-uri=${FRONTEND_URL:http://localhost:3000}/oauth2/redirect

# ===============================
# = LOGGING CONFIGURATION
# ===============================
logging.level.com.vini.agendaai=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
